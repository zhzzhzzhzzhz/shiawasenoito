<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">系统总体结构图</title>
  <desc id="desc">《幸せの糸》智能体系统结构：Electron/React 客户端经 Nginx 接入 FastAPI 与 Socket.IO 后端，后端包含 GameSession、RoomManager 内存房间与 Brain 接口，经 LLM 网关调用独立推理服务，MySQL 负责用户与对局记录持久化。</desc>
  <rect width="960" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#455a64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" fill="#263238">
    <rect x="310" y="30" width="340" height="56" rx="8" fill="#eef4fc" stroke="#4a6fa5" stroke-width="1.2"/>
    <text x="480" y="54" text-anchor="middle" font-size="15" font-weight="600">Electron / React 桌面客户端</text>
    <text x="480" y="74" text-anchor="middle" font-size="12" fill="#52606d">棋盘 · 回合 · 行动卡 · 对局结果</text>
    <line x1="480" y1="86" x2="480" y2="122" stroke="#455a64" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="490" y="108" font-size="11" fill="#52606d">REST ／ Socket.IO</text>
    <rect x="330" y="122" width="300" height="44" rx="8" fill="#eef4fc" stroke="#4a6fa5" stroke-width="1.2"/>
    <text x="480" y="149" text-anchor="middle" font-size="14" font-weight="600">Nginx（生产入口 25891→80）</text>
    <line x1="480" y1="166" x2="480" y2="200" stroke="#455a64" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="90" y="200" width="780" height="200" rx="12" fill="#f7fafd" stroke="#c3d3e8" stroke-width="1.2"/>
    <text x="480" y="230" text-anchor="middle" font-size="15" font-weight="600">FastAPI + Socket.IO 后端（3000 端口）</text>
    <rect x="110" y="248" width="230" height="80" rx="8" fill="#eef4fc" stroke="#4a6fa5" stroke-width="1.2"/>
    <text x="225" y="276" text-anchor="middle" font-size="14" font-weight="600">GameSession</text>
    <text x="225" y="297" text-anchor="middle" font-size="11" fill="#52606d">棋盘 · 阶段 · 胜负判定</text>
    <text x="225" y="315" text-anchor="middle" font-size="11" fill="#52606d">回合计时 · 历史记录</text>
    <rect x="365" y="248" width="230" height="80" rx="8" fill="#eef4fc" stroke="#4a6fa5" stroke-width="1.2"/>
    <text x="480" y="276" text-anchor="middle" font-size="14" font-weight="600">RoomManager（内存）</text>
    <text x="480" y="297" text-anchor="middle" font-size="11" fill="#52606d">rooms · match_queue</text>
    <text x="480" y="315" text-anchor="middle" font-size="11" fill="#52606d">player_rooms</text>
    <rect x="620" y="248" width="230" height="80" rx="8" fill="#eef4fc" stroke="#4a6fa5" stroke-width="1.2"/>
    <text x="735" y="276" text-anchor="middle" font-size="14" font-weight="600">Brain 接口</text>
    <text x="735" y="297" text-anchor="middle" font-size="11" fill="#52606d">RuleBrain ／ AgentBrain</text>
    <text x="735" y="315" text-anchor="middle" font-size="11" fill="#52606d">build_brain(aiBackend)</text>
    <line x1="170" y1="400" x2="170" y2="436" stroke="#8a9bb0" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <text x="180" y="422" font-size="11" fill="#52606d">持久化</text>
    <line x1="480" y1="400" x2="480" y2="436" stroke="#455a64" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="70" y="436" width="200" height="50" rx="8" fill="#f2f4f7" stroke="#8a9bb0" stroke-width="1.2"/>
    <text x="170" y="457" text-anchor="middle" font-size="13" font-weight="600">MySQL · happy_threads</text>
    <text x="170" y="475" text-anchor="middle" font-size="11" fill="#52606d">users ／ game_records</text>
    <rect x="330" y="436" width="300" height="50" rx="8" fill="#eef4fc" stroke="#4a6fa5" stroke-width="1.2"/>
    <text x="480" y="457" text-anchor="middle" font-size="13" font-weight="600">AgentBrain → LLM 网关</text>
    <text x="480" y="475" text-anchor="middle" font-size="11" fill="#52606d">/v1/chat/completions · JSON 模式</text>
    <line x1="480" y1="486" x2="480" y2="520" stroke="#455a64" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="250" y="520" width="460" height="64" rx="8" fill="#e9f2fb" stroke="#2f6bb0" stroke-width="1.4"/>
    <text x="480" y="544" text-anchor="middle" font-size="14" font-weight="600">cloud_serve.py 独立推理服务（8001）</text>
    <text x="480" y="566" text-anchor="middle" font-size="11" fill="#52606d">4bit NF4 Qwen3-8B + 175MB LoRA 适配器 · GPU</text>
    <text x="480" y="606" text-anchor="middle" font-size="11" fill="#8a9bb0">本地模式：客户端 → 本机 3000 后端 → 本机 8001 推理；生产模式经 Nginx 入口接入。</text>
  </g>
</svg>
