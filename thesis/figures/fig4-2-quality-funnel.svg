<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">质量分档漏斗</title>
  <desc id="desc">546 条原始决策点排除 48 条无思维链记录后，498 条分为 A 档 99 条、B 档 251 条、C 档 148 条；A+B 形成 350 条 SFT 示范，C 档进入 148 对 DPO 偏好数据。</desc>
  <rect width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#455a64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" fill="#263238">
    <rect x="200" y="50" width="560" height="64" rx="8" fill="#eef4fc" stroke="#4a6fa5" stroke-width="1.2"/>
    <text x="480" y="78" text-anchor="middle" font-size="15" font-weight="600">546 条原始决策点（g- 批次）</text>
    <text x="480" y="99" text-anchor="middle" font-size="11" fill="#52606d">项目早期采集 · 每次决策一点</text>
    <line x1="480" y1="114" x2="480" y2="150" stroke="#455a64" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="492" y="138" font-size="11" fill="#b04a3f">−48 条（reasoning 为空，不进入分档）</text>
    <rect x="240" y="152" width="480" height="56" rx="8" fill="#eef4fc" stroke="#4a6fa5" stroke-width="1.2"/>
    <text x="480" y="176" text-anchor="middle" font-size="14" font-weight="600">498 条进入 A / B / C 自动质量分档</text>
    <text x="480" y="196" text-anchor="middle" font-size="11" fill="#52606d">按推理链长度与正派命中数划分（screen_sft.py）</text>
    <line x1="480" y1="208" x2="480" y2="246" stroke="#455a64" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="140" y="248" width="200" height="118" rx="8" fill="#eaf6ec" stroke="#3f8a55" stroke-width="1.2"/>
    <text x="240" y="278" text-anchor="middle" font-size="14" font-weight="600">A 档 99 条</text>
    <text x="240" y="304" text-anchor="middle" font-size="11" fill="#52606d">推理 ≥60 字符</text>
    <text x="240" y="324" text-anchor="middle" font-size="11" fill="#52606d">正派命中 ≥2 名</text>
    <text x="240" y="348" text-anchor="middle" font-size="11" fill="#52606d">人工抽检前 10 条</text>
    <rect x="380" y="248" width="200" height="118" rx="8" fill="#eaf6ec" stroke="#3f8a55" stroke-width="1.2"/>
    <text x="480" y="278" text-anchor="middle" font-size="14" font-weight="600">B 档 251 条</text>
    <text x="480" y="304" text-anchor="middle" font-size="11" fill="#52606d">推理 ≥30 字符</text>
    <text x="480" y="324" text-anchor="middle" font-size="11" fill="#52606d">或命中 1 名</text>
    <text x="480" y="348" text-anchor="middle" font-size="11" fill="#52606d">常规局面覆盖</text>
    <rect x="620" y="248" width="200" height="118" rx="8" fill="#fff6e5" stroke="#b8802f" stroke-width="1.2"/>
    <text x="720" y="278" text-anchor="middle" font-size="14" font-weight="600">C 档 148 条</text>
    <text x="720" y="304" text-anchor="middle" font-size="11" fill="#52606d">推理 &lt;30 字符</text>
    <text x="720" y="324" text-anchor="middle" font-size="11" fill="#52606d">或命中 0 名</text>
    <text x="720" y="348" text-anchor="middle" font-size="11" fill="#52606d">保留为反面样本</text>
    <line x1="240" y1="366" x2="310" y2="416" stroke="#455a64" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="480" y1="366" x2="440" y2="416" stroke="#455a64" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="720" y1="366" x2="720" y2="416" stroke="#455a64" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="220" y="418" width="340" height="72" rx="8" fill="#eaf6ec" stroke="#3f8a55" stroke-width="1.4"/>
    <text x="390" y="446" text-anchor="middle" font-size="14" font-weight="600">SFT 示范 350 条（A+B）</text>
    <text x="390" y="468" text-anchor="middle" font-size="11" fill="#52606d">good 198 条 ／ evil 152 条</text>
    <rect x="580" y="418" width="280" height="72" rx="8" fill="#fff6e5" stroke="#b8802f" stroke-width="1.4"/>
    <text x="720" y="446" text-anchor="middle" font-size="14" font-weight="600">DPO 偏好 148 对</text>
    <text x="720" y="468" text-anchor="middle" font-size="11" fill="#52606d">C 档负例 × 同局面较优回答</text>
    <text x="480" y="530" text-anchor="middle" font-size="11" fill="#8a9bb0">质量等级为自动筛查口径，不等同于整局胜负标签；后期 1818 条记录不参与本漏斗。</text>
  </g>
</svg>
