<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">对局数据管线</title>
  <desc id="desc">数据管线依次为规则环境、观测编码、提示词教师、JSON 校验、引擎执行、整局记录与 sample_id 检查，批次一与批次二共用同一管线且统计相互隔离。</desc>
  <rect width="960" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#455a64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" fill="#263238">
    <rect x="42" y="80" width="108" height="84" rx="8" fill="#eef4fc" stroke="#4a6fa5" stroke-width="1.2"/>
    <text x="96" y="116" text-anchor="middle" font-size="13" font-weight="600">规则环境</text>
    <text x="96" y="138" text-anchor="middle" font-size="10" fill="#52606d">GameSession</text>
    <text x="96" y="152" text-anchor="middle" font-size="10" fill="#52606d">最长 6 回合</text>
    <line x1="150" y1="122" x2="168" y2="122" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="170" y="80" width="108" height="84" rx="8" fill="#eef4fc" stroke="#4a6fa5" stroke-width="1.2"/>
    <text x="224" y="116" text-anchor="middle" font-size="13" font-weight="600">观测编码</text>
    <text x="224" y="138" text-anchor="middle" font-size="10" fill="#52606d">8 类字段</text>
    <text x="224" y="152" text-anchor="middle" font-size="10" fill="#52606d">按阵营过滤</text>
    <line x1="278" y1="122" x2="296" y2="122" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="298" y="80" width="108" height="84" rx="8" fill="#eef4fc" stroke="#4a6fa5" stroke-width="1.2"/>
    <text x="352" y="116" text-anchor="middle" font-size="13" font-weight="600">提示词教师</text>
    <text x="352" y="138" text-anchor="middle" font-size="10" fill="#52606d">18 条原则</text>
    <text x="352" y="152" text-anchor="middle" font-size="10" fill="#52606d">四段式推理</text>
    <line x1="406" y1="122" x2="424" y2="122" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="426" y="80" width="108" height="84" rx="8" fill="#eef4fc" stroke="#4a6fa5" stroke-width="1.2"/>
    <text x="480" y="116" text-anchor="middle" font-size="13" font-weight="600">JSON 校验</text>
    <text x="480" y="138" text-anchor="middle" font-size="10" fill="#52606d">validator.py</text>
    <text x="480" y="152" text-anchor="middle" font-size="10" fill="#52606d">字段与规则检查</text>
    <line x1="534" y1="122" x2="552" y2="122" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="554" y="80" width="108" height="84" rx="8" fill="#eef4fc" stroke="#4a6fa5" stroke-width="1.2"/>
    <text x="608" y="116" text-anchor="middle" font-size="13" font-weight="600">引擎执行</text>
    <text x="608" y="138" text-anchor="middle" font-size="10" fill="#52606d">game_engine</text>
    <text x="608" y="152" text-anchor="middle" font-size="10" fill="#52606d">动作落地</text>
    <line x1="662" y1="122" x2="680" y2="122" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="682" y="80" width="108" height="84" rx="8" fill="#eef4fc" stroke="#4a6fa5" stroke-width="1.2"/>
    <text x="736" y="116" text-anchor="middle" font-size="13" font-weight="600">整局记录</text>
    <text x="736" y="138" text-anchor="middle" font-size="10" fill="#52606d">recorder.py</text>
    <text x="736" y="152" text-anchor="middle" font-size="10" fill="#52606d">game_meta</text>
    <line x1="790" y1="122" x2="808" y2="122" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="810" y="80" width="108" height="84" rx="8" fill="#eaf6ec" stroke="#3f8a55" stroke-width="1.2"/>
    <text x="864" y="116" text-anchor="middle" font-size="13" font-weight="600">ID 检查</text>
    <text x="864" y="138" text-anchor="middle" font-size="10" fill="#52606d">sample_id</text>
    <text x="864" y="152" text-anchor="middle" font-size="10" fill="#52606d">批次无交集</text>
    <text x="480" y="212" text-anchor="middle" font-size="11" fill="#8a9bb0">批次一 g-（546 条决策点）与批次二 gg-（1818 条整局记录）共用同一管线，统计对象相互隔离。</text>
  </g>
</svg>
