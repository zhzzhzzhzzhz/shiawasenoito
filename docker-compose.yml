# 《幸福的丝线》后端 Docker 编排（智能体版）
# 组成：MySQL 8 + 后端（FastAPI+Socket.IO+智能体） + Nginx 反代（桌面客户端入口）
# 前端不再部署 Web 版，由 Electron 桌面客户端连接本服务器
#
# 使用方法：
#   1. git clone 仓库到服务器（含 backend-python/ 与 deploy/）
#   2. 在本文件同级创建 .env（见下方示例，密钥务必修改）
#   3. docker compose up -d --build
#   4. 桌面客户端 config.json 的 backendUrl 填 http://服务器IP
#
# 常用命令：
#   查看状态: docker compose ps
#   查看日志: docker compose logs -f backend
#   停止:     docker compose down
#   完全清理(会清库): docker compose down -v
#
# .env 示例：
#   MYSQL_ROOT_PASSWORD=你的强密码
#   JWT_SECRET=足够长的随机串
#   AGENT_LLM_BASE_URL=https://api.deepseek.com/v1
#   AGENT_LLM_API_KEY=sk-你的key
#   AGENT_LLM_MODEL=deepseek-chat

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: happy-threads-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: happy_threads
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ==================== Python 后端（智能体版）====================
  backend:
    build:
      context: ./backend-python
    container_name: happy-threads-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: happy_threads
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
      # ===== LLM 智能体（可选：不配则自动回退规则 AI，对局永不卡死）=====
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-deepseek-chat}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:3000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==================== Nginx 反代（桌面客户端入口）====================
  nginx:
    image: nginx:alpine
    container_name: happy-threads-nginx
    restart: unless-stopped
    ports:
      - "25891:80"
      # HTTPS 时放开 443 并挂载证书
      # - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
